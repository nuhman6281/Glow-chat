

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: glow-chat-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-glow_chat}
    volumes:
      - mongodb_data:/data/db
      - ./server/scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "27017:27017"
    networks:
      - glow-chat-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for Session Store and Caching
  redis:
    image: redis:7.2-alpine
    container_name: glow-chat-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - glow-chat-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # TURN Server for WebRTC
  coturn:
    image: coturn/coturn:4.6.2
    container_name: glow-chat-coturn
    restart: unless-stopped
    network_mode: host
    environment:
      - TURN_USERNAME=${TURN_USERNAME:-turnuser}
      - TURN_PASSWORD=${TURN_PASSWORD:-turnpassword}
      - REALM=${TURN_REALM:-localhost}
      - MIN_PORT=${TURN_MIN_PORT:-49152}
      - MAX_PORT=${TURN_MAX_PORT:-65535}
    command: |
      -n 
      --log-file=stdout 
      --realm=${TURN_REALM:-localhost} 
      --server-name=${TURN_REALM:-localhost}
      --listening-port=3478 
      --tls-listening-port=5349
      --min-port=${TURN_MIN_PORT:-49152} 
      --max-port=${TURN_MAX_PORT:-65535}
      --fingerprint 
      --use-auth-secret 
      --static-auth-secret=${TURN_SECRET:-static-secret}
      --user=${TURN_USERNAME:-turnuser}:${TURN_PASSWORD:-turnpassword}
      --lt-cred-mech
      --no-dtls
      --no-tls
    volumes:
      - ./certs:/etc/coturn/certs:ro

  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: glow-chat-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      
      # Database
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-password}@mongodb:27017/${MONGO_DB_NAME:-glow_chat}?authSource=admin
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379
      
      # Authentication
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      JWT_EXPIRE: 7d
      
      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,https://yourdomain.com}
      
      # File Upload
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: 50mb
      
      # WebRTC
      TURN_SERVER_URL: ${TURN_SERVER_URL:-turn:localhost:3478}
      TURN_USERNAME: ${TURN_USERNAME:-turnuser}
      TURN_PASSWORD: ${TURN_PASSWORD:-turnpassword}
      TURN_SECRET: ${TURN_SECRET:-static-secret}
      
      # Features
      ENABLE_FRIEND_REQUESTS: true
      ENABLE_GROUP_CHAT: true
      ENABLE_FILE_UPLOAD: true
      ENABLE_VOICE_CALLS: true
      ENABLE_VIDEO_CALLS: true
      ENABLE_SCREEN_SHARE: true
      
      # Rate Limiting
      RATE_LIMIT_WINDOW: 15
      RATE_LIMIT_MAX: 100
      
      # Monitoring
      ENABLE_LOGGING: true
      LOG_LEVEL: info
      
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    ports:
      - "3000:3000"
    networks:
      - glow-chat-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Client
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3000/api}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:3000}
        - VITE_TURN_SERVER_URL=${TURN_SERVER_URL:-turn:localhost:3478}
        - VITE_APP_NAME=${VITE_APP_NAME:-Glow Chat}
        - VITE_APP_VERSION=${VITE_APP_VERSION:-1.0.0}
    container_name: glow-chat-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - glow-chat-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: glow-chat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - logs_data:/var/log/nginx
    networks:
      - glow-chat-network
    depends_on:
      - frontend
      - backend
    profiles:
      - nginx

  # Monitoring with Prometheus (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: glow-chat-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - glow-chat-network
    profiles:
      - monitoring

  # Grafana for Dashboards (Optional)
  grafana:
    image: grafana/grafana:latest
    container_name: glow-chat-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - glow-chat-network
    depends_on:
      - prometheus
    profiles:
      - monitoring

networks:
  glow-chat-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
