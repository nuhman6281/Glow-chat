services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    # env_file:
    #   - .env
    environment:
      # Server Configuration
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${BACKEND_PORT:-3000}
      - BACKEND_PORT=${BACKEND_PORT:-3000}

      # Database Configuration
      - MONGODB_URI=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/glow-chat?authSource=admin
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/glow-chat?authSource=admin
      - MONGO_DB_NAME=${MONGO_DB_NAME:-glow-chat}
      - MONGO_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_PORT=${MONGO_PORT:-27017}

      # Redis Configuration
      - REDIS_URL=redis://redis:6379
      - REDIS_PORT=${REDIS_PORT:-6379}

      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET:-development-secret-key-change-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}

      # Client Configuration
      - CLIENT_URL=${CLIENT_URL:-http://localhost:8080}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080}

      # API Configuration
      - API_BASE_URL=${API_BASE_URL:-http://localhost:3000}

      # Security Configuration
      - SESSION_SECRET=${SESSION_SECRET:-development-session-secret}
      - BCRYPT_SALT_ROUNDS=${BCRYPT_SALT_ROUNDS:-12}

      # File Upload Configuration
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-5242880}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}

      # Email Configuration
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}

      # Logging Configuration
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FILE=${LOG_FILE:-logs/app.log}

      # Performance Configuration
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_TIMEOUT=${DB_TIMEOUT:-30000}

      # Development Tools
      - DEBUG=${DEBUG:-false}
      - ENABLE_SWAGGER=${ENABLE_SWAGGER:-false}
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - chat-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mongo:
    image: mongo:6.0
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME:-chatapp}
    volumes:
      - mongo-data:/data/db
    networks:
      - chat-net
    restart: unless-stopped

  redis:
    image: redis:7.0-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - chat-net
    restart: unless-stopped

  # Optional frontend service - uncomment if needed
  # frontend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.frontend
  #   ports:
  #     - "${FRONTEND_PORT:-8080}:80"
  #   environment:
  #     - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:3000}
  #     - NODE_ENV=${NODE_ENV:-development}
  #   depends_on:
  #     - backend
  #   networks:
  #     - chat-net
  #   restart: unless-stopped

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local

networks:
  chat-net:
    driver: bridge
